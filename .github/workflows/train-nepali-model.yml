name: Train Nepali model

# Trains a new version of the owner's Nepali model on their Training data
# recordings and pushes it to their Hugging Face repo. Every run trains from
# the original checkpoint on all recordings so far; if the result beats it on
# held-out clips it switches itself on (Settings -> Nepali model). The run's
# summary page says what happened. See modal/train_nepali.py and model/.
#
# Needs the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repo secrets, and HF_TOKEN
# plus BACKEND_SECRET in the Modal secret `voiceforge-backend`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Name of the new version; auto = the next free vN in the repo"
        required: true
        default: "auto"
      speaker:
        description: "Speaker name on the Training data page"
        required: true
        default: "Bijay"
      voice:
        description: "Voice id used as the reference while training (same one used for generating)"
        required: true
        default: "bijay-nepali-final-3d37742e"
      base_file:
        description: "Checkpoint to continue from"
        required: true
        default: "t3_mtl_nepali_merged.safetensors"
      epochs:
        description: "Passes over the recordings"
        required: true
        default: "6"
      smoke:
        description: "Pipeline test only: 2 short epochs, nothing pushed (works with few clips)"
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install --upgrade modal

      - name: Train
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -eo pipefail
          SMOKE=""
          if [ "${{ inputs.smoke }}" = "true" ]; then SMOKE="--smoke"; fi
          modal run modal/train_nepali.py \
            --version "${{ inputs.version }}" \
            --speaker "${{ inputs.speaker }}" \
            --voice "${{ inputs.voice }}" \
            --base-file "${{ inputs.base_file }}" \
            --epochs "${{ inputs.epochs }}" $SMOKE 2>&1 | tee train.log

      # The outcome on the run's summary page: whether this was only a smoke
      # test, and whether the new version was switched on.
      - name: Summary
        if: always()
        run: grep "^RESULT:" train.log >> "$GITHUB_STEP_SUMMARY" || echo "RESULT: the run stopped before training finished; see the Train step log." >> "$GITHUB_STEP_SUMMARY"
