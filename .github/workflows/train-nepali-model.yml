name: Train Nepali model

# Trains a new version of the owner's Nepali model on their Training data
# recordings and pushes it to their Hugging Face repo. Nothing goes live:
# the backends keep using VOICEFORGE_NE_FILE until the new version has been
# evaluated against the current one. See modal/train_nepali.py and model/.
#
# Needs the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repo secrets, and HF_TOKEN
# plus BACKEND_SECRET in the Modal secret `voiceforge-backend`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Name of the new version (becomes <version>.safetensors in the repo)"
        required: true
        default: "v3"
      speaker:
        description: "Speaker name on the Training data page"
        required: true
        default: "Bijay"
      voice:
        description: "Voice id used as the reference while training (same one used for generating)"
        required: true
        default: "bijay-nepali-recovered-1fa71f59"
      base_file:
        description: "Checkpoint to continue from"
        required: true
        default: "t3_mtl_nepali_merged.safetensors"
      epochs:
        description: "Passes over the recordings"
        required: true
        default: "6"
      smoke:
        description: "Pipeline test only: 2 short epochs, nothing pushed (works with few clips)"
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install --upgrade modal

      - name: Train
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -e
          SMOKE=""
          if [ "${{ inputs.smoke }}" = "true" ]; then SMOKE="--smoke"; fi
          modal run modal/train_nepali.py \
            --version "${{ inputs.version }}" \
            --speaker "${{ inputs.speaker }}" \
            --voice "${{ inputs.voice }}" \
            --base-file "${{ inputs.base_file }}" \
            --epochs "${{ inputs.epochs }}" $SMOKE
