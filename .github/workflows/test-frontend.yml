name: Test frontend

# Lint, types, unit tests, a production build and the Playwright end-to-end
# suite for the Next.js app. The e2e tests mock every /api call in the
# browser, so no database, GPU or secret is needed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "modal/**"
      - "colab/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "backend/**"
      - "modal/**"
      - "colab/**"
  workflow_dispatch:

concurrency:
  group: test-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
